name: Bicep Destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete TP resource groups
        run: |
          for RG in \
            rg-abdel-tp104-ex1 \
            rg-abdel-tp104-ex2 \
            rg-abdel-tp104-ex3 \
            rg-abdel-tp104-ex4
          do
            echo "Suppression de $RG"

            if az group exists --name "$RG" | grep -q true; then
              az group delete \
                --name "$RG" \
                --yes
            else
              echo "$RG n'existe pas."
            fi
          done
